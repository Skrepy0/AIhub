name: Deploy AIhub to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 3. 构建前端
      - name: Build frontend
        run: |
          cd web
          bun install
          bun run build
        

      # 4. 打包构建产物
      - name: Archive dist
        run: |
          cd web
          tar -czf ../web-dist.tar.gz dist/

      # 5. 通过 SCP 将打包文件传到服务器
      - name: Upload build artifacts via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "./web-dist.tar.gz"          # 直接上传压缩包
          target: "/root/AIhub/"               # 上传到项目根目录
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          timeout: 60s
          debug: true
        
      # 6. 执行部署脚本
      - name: Execute deployment script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
        
            cd /root/AIhub
        
            # 停止服务
            systemctl stop aihub || true
        
            # 备份（可选）
            mkdir -p /root/AIhubTempData
            cp one-api.db .env docker-compose.yml /root/AIhubTempData/ 2>/dev/null || true
            cp -r data logs /root/AIhubTempData/ 2>/dev/null || true
        
            mkdir -p /root/aihub-database-backups
            cp one-api.db /root/aihub-database-backups/one-api-$(date +%Y%m%d%H%M%S).db 2>/dev/null || true
        
            # 拉取最新代码（后端）
            git pull origin main
        
            # 恢复备份的配置文件（如有）
            cp -rf /root/AIhubTempData/* /root/AIhub/ 2>/dev/null || true
        
            # 更新 systemd 服务文件
            cp /root/AIhub/aihub.service /etc/systemd/system/
            systemctl daemon-reload
        
            # 解压前端构建产物到 web/ 目录
            tar -xzf web-dist.tar.gz -C web/
            rm -f web-dist.tar.gz
        
            # 启动服务
            systemctl start aihub