name: Deploy AIhub to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 3. 构建前端
      - name: Build frontend
        run: |
          cd web
          bun install
          bun run build
        

      # 4. 打包构建产物
      - name: Archive dist
        run: |
          cd web
          tar -czf ../web-dist.tar.gz dist/

      # 5. 通过 SCP 将打包文件传到服务器
      - name: Upload build artifacts via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}        # 服务器 IP 或域名（如 8.215.74.129）
          username: ${{ secrets.SERVER_USER }}    # 登录用户名（如 root 或 skrepy）
          password: ${{ secrets.SERVER_PASSWORD }} # 登录密码（明文，务必存入 GitHub Secrets）
          port: 22                                # SSH 端口，默认 22
          source: "./dist/*"                      # 要传输的文件或目录
          target: "/path/to/deploy"               # 服务器上的目标路径
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}  # 可选，但强烈建议添加避免主机密钥验证问题
          timeout: 60s                            # 可选，增加超时时间
          debug: true                             # 可选，开启调试输出

      - name: Execute deployment script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}   # 改为密码，同时删除 key 行
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            cd /root/AIhub

            # 停止服务
            systemctl stop aihub

            # 备份必要文件
            mkdir -p /root/AIhubTempData
            rm -rf /root/AIhubTempData/*
            cp one-api.db .env docker-compose.yml /root/AIhubTempData/
            cp -r data logs /root/AIhubTempData/

            # 备份数据库（以 SQLite 为例）
            mkdir -p /root/aihub-database-backups
            cp one-api.db /root/aihub-database-backups/one-api-$(date +%Y%m%d%H%M%S).db

            # 拉取最新代码（后端代码、配置文件等）
            git pull origin main

            # 恢复备份的文件（覆盖拉取后的配置）
            cp -rf /root/AIhubTempData/* /root/AIhub/

            # 更新 systemd 服务文件
            rm -f /etc/systemd/system/aihub.service
            cp /root/AIhub/aihub.service /etc/systemd/system/
            systemctl daemon-reload

            # 解压前端构建产物到 web/dist
            tar -xzf web-dist.tar.gz -C web/
            rm -f web-dist.tar.gz   # 清理压缩包

            # 启动服务
            systemctl start aihub